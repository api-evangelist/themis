name: Themis
description: >-
  Themis (askthemis.com) is a governance, risk, and compliance (GRC) SaaS
  platform positioned as a "compliance collaboration" tool that streamlines
  partnerships between companies and their vendors, banks, credit unions, and
  fintechs by accelerating onboarding, due diligence, and risk assessments. The
  platform bundles modules for policies, procedures, documents, vendor and risk
  management, risk register, control mapping, issue and change management,
  complaints, QA testing, training, audit, key risk indicators (KRI),
  FINRA 4530, and conflicts of interest. Themis serves banking, payments,
  lending, crypto/DeFi, exchanges, BaaS, and credit-card sectors, and is used
  through a hosted web application at portal.askthemis.com. As of this
  enrichment pass it exposes no public or developer API surface. Themis is a
  portfolio company of Felicis.
